name: Actualizar Playhub
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playhub-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar Extractor
        env:
          PLAYHUB_TOKEN: ${{ secrets.PLAYHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAX_NEW_PER_RUN: '1200'
        run: python playhub_sync.py
      - name: Guardar mapas y caché
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add mapa_peliculas_playhub.json mapa_series_playhub.json playhub_cache.json
          git commit -m "Actualización horaria Playhub" || exit 0
          git push
