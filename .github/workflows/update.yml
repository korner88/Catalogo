name: Actualizar Playhub
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 👇 LA LLAVE MAESTRA: Le damos permiso de escritura al bot 👇
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 👈 Actualizado a v4
      - name: Configurar Python
        uses: actions/setup-python@v5 # 👈 Actualizado a v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar Extractor
        run: python playhub_sync.py
      - name: Guardar mapas
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add mapa_peliculas_playhub.json mapa_series_playhub.json
          git commit -m "Actualización horaria Playhub" || exit 0
          git push
